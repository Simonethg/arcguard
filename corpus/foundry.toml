# ArcGuard corpus — Arc testnet and local arc-anvil only.
# Do not add a mainnet RPC here. This project never deploys and never sends
# mainnet transactions.
#
# Sources for the rules exercised by src/vulnerable and src/fixed:
# - https://docs.arc.io/arc/references/evm-differences
# - https://docs.arc.io/arc/tutorials/porting-contracts-to-arc
# - https://www.arc.io/blog/arc-compatibility-guide-for-existing-evm-apps

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
# arc-forge reads this and executes tests under Arc rules.
# Upstream forge does not implement those rules; do not use it for this corpus.
network = "arc"

[profile.arc]
network = "arc"
evm_version = "osaka"
solc = "0.8.30"

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
