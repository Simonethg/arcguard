name: pytest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: python -m pip install -e ".[dev,detectors]" solc-select

      - name: Solidity compiler for detector tests
        run: |
          solc-select install 0.8.28
          solc-select use 0.8.28

      - name: Pytest
        run: pytest
