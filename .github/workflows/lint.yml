name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and linters
        run: python -m pip install -e ".[dev,detectors]" solc-select

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Solidity compiler for detector tests
        run: |
          solc-select install 0.8.28
          solc-select use 0.8.28

      - name: CLI help
        run: arcaudit --help

      - name: Tests
        run: pytest
