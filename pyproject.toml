[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcguard"
version = "0.1.0"
description = "Open-source scanner for Arc-specific pitfalls when porting EVM apps. Arc testnet only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Simoneth Gomez"}]
keywords = [
  "arc",
  "solidity",
  "slither",
  "usdc",
  "static-analysis",
  "security",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
detectors = ["slither-analyzer>=0.10.4"]
dev = [
  "pre-commit>=3.5",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Simonethg/arcguard"
Documentation = "https://github.com/Simonethg/arcguard/tree/main/docs/rules"
Repository = "https://github.com/Simonethg/arcguard"
Issues = "https://github.com/Simonethg/arcguard/issues"

[project.scripts]
arcaudit = "arcguard.cli.main:main"

# Slither loads this group and expects make_plugin() -> (detectors, printers).
[project.entry-points."slither_analyzer.plugin"]
arcguard = "arcguard.plugin:make_plugin"

# detectors/ is the arcguard package. cli/ is arcguard.cli so the monorepo
# folders stay at the repository root.
[tool.setuptools]
packages = ["arcguard", "arcguard.cli"]

[tool.setuptools.package-dir]
"arcguard" = "detectors"
"arcguard.cli" = "cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["detectors", "cli", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["arcguard"]
